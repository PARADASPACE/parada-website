<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/styles/live.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Paráda live</title>
</head>
<body>
    <div class="main__container">
        <nav>
            <a href="#temperature_chart">temp</a>
            <a href="#pressure_chart">pressure</a>
            <a href="#humidity_chart">humidity</a>
        </nav>
        <header>
            <h1><span>PARADA</span> live</h1>
        </header>
        <div class="charts">
            <canvas id="temperature_chart"></canvas>
            <canvas id="pressure_chart"></canvas>
            <canvas id="humidity_chart"></canvas>
        </div>
        <div id="map" style="height: 400px;"></div>

        <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
        <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

        <script>
            var map = L.map('map').setView([49.8397, 18.2921], 13); // lat, lon, zoom

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            L.marker([49.8397, 18.2921]).addTo(map)
                .bindPopup('PRADA')
                .openPopup();
        </script>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const temperatureChart = new Chart(document.getElementById('temperature_chart'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [ {
                    label: '°C',
                    data: [],
                    borderColor: 'rgba(75,192,192,1)',
                    borderWidth: 2,
                } ]
            },
            options: {
                scales: {
                    x: { title: { display: true, text: 'Time' } },
                    y: { title: { display: true, text: 'Value' } }
                },
                plugins: {
                    title: {
                        display: true,
                        text: 'Temperature',
                        font: {
                            size: 24,        
                            weight: 'bold'  
                        },
                        color: '#333',     
                        padding: {
                            top: 20,
                            bottom: 20
                        }
                    }
                }
            }
        });
        const pressureChart= new Chart(document.getElementById('pressure_chart'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [ {
                    label: 'Pa',
                    data: [],
                    borderColor: 'rgba(219, 83, 117)',
                    borderWidth: 2,
                } ]
            },
            options: {
                scales: {
                    x: { title: { display: true, text: 'Time' } },
                    y: { title: { display: true, text: 'Value' } }
                },
                plugins: {
                    title: {
                        display: true,
                        text: 'Pressure',
                        font: {
                            size: 24,        
                            weight: 'bold'  
                        },
                        color: '#333',     
                        padding: {
                            top: 20,
                            bottom: 20
                        }
                    }
                }
            }
        });
        const humidityChart = new Chart(document.getElementById('humidity_chart'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [ {
                    label: '%',
                    data: [],
                    borderColor: 'rgba(135, 255, 101)',
                    borderWidth: 2,
                } ]
            },
            options: {
                scales: {
                    x: { title: { display: true, text: 'Time' } },
                    y: { title: { display: true, text: 'Value' } }
                },
                plugins: {
                    title: {
                        display: true,
                        text: 'Humidity',
                        font: {
                            size: 24,        
                            weight: 'bold'  
                        },
                        color: '#333',     
                        padding: {
                            top: 20,
                            bottom: 20
                        }
                    }
                }
            }
        });
        function fetchDataAndUpdateChart() {
            fetch('/api/data/temperature')
                .then(res => res.json())
                .then(data => {
                    // Reverse so oldest to newest
                    data.reverse();

                    const labels = data.map(item => item.timestamp);
                    const values = data.map(item => item.value);

                    temperatureChart.data.labels = labels;
                    temperatureChart.data.datasets[0].data = values;
                    temperatureChart.update();
                });
            fetch('/api/data/pressure')
                .then(res => res.json())
                .then(data => {
                    // Reverse so oldest to newest
                    data.reverse();

                    const labels = data.map(item => item.timestamp);
                    const values = data.map(item => item.value);

                    pressureChart.data.labels = labels;
                    pressureChart.data.datasets[0].data = values;
                    pressureChart.update();
                });
            fetch('/api/data/humidity')
                .then(res => res.json())
                .then(data => {
                    // Reverse so oldest to newest
                    data.reverse();

                    const labels = data.map(item => item.timestamp);
                    const values = data.map(item => item.value);

                    humidityChart.data.labels = labels;
                    humidityChart.data.datasets[0].data = values;
                    humidityChart.update();
                });
        }
        setInterval(fetchDataAndUpdateChart, 3000);

</script>
</body>
</html>
